name: Copy Inganathi diagrams into Coki
# Sync source artwork into the independent Coki repository.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-coki-diagrams.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Coki
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out Inganathi source
        uses: actions/checkout@v4
        with:
          repository: Luxolog/inganathi-k53
          ref: main
          path: source
      - name: Copy all road-sign and vehicle-control artwork
        run: |
          mkdir -p assets
          rm -rf assets/road-signs assets/control-diagrams
          cp -R source/assets/road-signs assets/road-signs
          cp -R source/assets/control-diagrams assets/control-diagrams
      - name: Make Coki use its own local image files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("road_signs.json", "clean_questions.json"):
              path = Path("study-library/inganathi-reference") / name
              data = json.loads(path.read_text())
              def localize(value):
                  if isinstance(value, str):
                      return value.replace("https://luxolog.github.io/inganathi-k53/", "")
                  if isinstance(value, list):
                      return [localize(item) for item in value]
                  if isinstance(value, dict):
                      return {key: localize(item) for key, item in value.items()}
                  return value
              path.write_text(json.dumps(localize(data), ensure_ascii=False, indent=2) + "\\n")
          manual = Path("manual.html")
          html = manual.read_text()
          html = html.replace("https://luxolog.github.io/inganathi-k53/assets/control-diagrams/", "assets/control-diagrams/")
          manual.write_text(html)
          PY
      - name: Commit copied assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/road-signs assets/control-diagrams study-library/inganathi-reference/road_signs.json study-library/inganathi-reference/clean_questions.json manual.html
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Copy road sign and vehicle control diagrams into Coki [skip ci]"
            git push
          fi
