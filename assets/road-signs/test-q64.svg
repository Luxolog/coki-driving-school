<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">Compulsory route for animal-drawn vehicles</title>
<desc id="desc">A blue circular mandatory road sign showing a white horse pulling a two-wheeled cart with a seated driver.</desc>
<rect width="600" height="420" fill="#fff"/>
<circle cx="300" cy="210" r="176" fill="#0756a5" stroke="#777" stroke-width="4"/>
