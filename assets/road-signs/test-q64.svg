 <path d="M294 135L282 124L279 107L291 116Z"/>
 <path d="M143 237L137 294L151 294L170 244Z"/>
 <path d="M180 245L174 300L188 300L204 246Z"/>
 <path d="M222 240L230 292L245 292L240 230Z"/>
 <path d="M246 225L260 277L274 273L263 215Z"/>
 <path d="M126 211Q102 194 112 172Q120 190 143 193Z" />
 <path d="M257 156Q278 146 285 128" fill="none" stroke-width="7"/>
</g>
<!-- harness and shafts -->
