<circle cx="380" cy="280" r="26" fill="none" stroke="#fff" stroke-width="9"/>
<circle cx="462" cy="280" r="26" fill="none" stroke="#fff" stroke-width="9"/>
<circle cx="380" cy="280" r="5" fill="#fff"/>
<circle cx="462" cy="280" r="5" fill="#fff"/>
</svg>