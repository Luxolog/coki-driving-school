<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coki K53 | Test Workspace</title>
<style>
:root{--green:#087a42;--red:#d92c32;--ink:#14231b;--muted:#607168;--paper:#f5f8f5;--line:#e1e9e2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{background:#101b15;color:white;padding:17px 22px;border-bottom:4px solid var(--green)}header a{color:white;text-decoration:none}
main{max-width:850px;margin:34px auto;padding:0 18px 60px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,34px)}.muted{color:var(--muted)}.eyebrow{color:var(--green);font-size:.75rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.question{font-size:1.2rem;font-weight:750;margin:24px 0}.options{display:grid;gap:10px}.option{display:flex;gap:12px;text-align:left;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:inherit;cursor:pointer}.option:hover,.option.chosen{border-color:var(--green);background:#eaf7ee}.letter{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#eff3ef;font-weight:800;flex:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--green);color:white;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}.btn.secondary{background:#edf3ef;color:#1c633b}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{height:8px;background:#e5ece6;border-radius:10px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:var(--green)}.empty{padding:20px;background:#fff5df;border-radius:12px;color:#684b12}.diagrams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:16px 0 22px}.diagrams figure{margin:0;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb}.diagrams img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain}.diagrams figcaption{font-size:.78rem;color:var(--muted);padding:5px}.meta{font-size:.8rem;color:var(--muted);text-transform:capitalize}
</style></head><body><header><a href="index.html">← Back to Coki Test Centre</a></header>
<main><div class="eyebrow">Coki learner portal</div><h1 id="heading">Test workspace</h1><p class="muted">64-question practice assessment · Questions and answer choices are shuffled for each attempt</p><section class="panel" id="app"><div class="empty">Loading test questions…</div></section></main>
<script>
const params=new URLSearchParams(location.search),testId=Math.max(1,Math.min(5,Number(params.get('test'))||1)),app=document.getElementById('app');document.getElementById('heading').textContent='Test '+testId;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
fetch('questions.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(bank=>{
 const original=bank['test'+testId]||[];if(original.length!==64){app.innerHTML='<div class="empty">This test must contain exactly 64 questions before it can be attempted.</div>';return}
 const questions=shuffle(original).map(q=>{const options=shuffle(q.options.map((label,i)=>({label,isCorrect:i===q.correctIndex})));return {...q,options,correctIndex:options.findIndex(o=>o.isCorrect)}});let index=0,answers={};
 function render(){const q=questions[index],done=Object.keys(answers).length;app.innerHTML='<strong>Question '+(index+1)+' of 64</strong><span class="meta"> · '+(q.category||'K53')+'</span><div class="progress"><span style="width:'+done/64*100+'%"></span></div><div class="question"></div><div class="diagrams"></div><div class="options"></div><div class="actions"><button class="btn secondary" id="prev" '+(index===0?'disabled':'')+'>Previous</button><button class="btn" id="next">'+(index===63?'Finish test':'Next question')+'</button></div><p class="muted">'+done+' of 64 answered</p>';
 app.querySelector('.question').textContent=q.question;const box=app.querySelector('.diagrams');(q.diagramImages||[]).forEach((url,n)=>{const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=url;img.alt='Question '+q.id+' road sign or vehicle control diagram';img.loading='lazy';img.onerror=()=>{f.innerHTML='<figcaption>Original diagram reference retained: '+url.split('/').pop()+'</figcaption>'};cap.textContent=(q.diagramMode==='vehicle_controls'?'Vehicle control diagram':'Road sign / question diagram')+(q.diagramImages.length>1?' '+(n+1):'');f.append(img,cap);box.append(f)});
 const opts=app.querySelector('.options');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option'+(answers[index]===i?' chosen':'');const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);const label=document.createElement('span');label.textContent=o.label;b.append(letter,label);b.onclick=()=>{answers[index]=i;render()};opts.append(b)});app.querySelector('#prev').onclick=()=>{index--;render()};app.querySelector('#next').onclick=()=>{if(index<63){index++;render()}else finish()};}
 function finish(){if(Object.keys(answers).length<64){index=questions.findIndex((q,i)=>answers[i]===undefined);render();const n=document.createElement('p');n.className='empty';n.textContent='Please answer all 64 questions before finishing.';app.prepend(n);return}const correct=questions.reduce((n,q,i)=>n+(answers[i]===q.correctIndex?1:0),0);app.innerHTML='<h2>Test completed</h2><p>You answered all 64 questions.</p><h3>'+correct+' / 64 correct ('+Math.round(correct/64*100)+'%)</h3><p class="muted">Practice result only. Learner records are not saved to a school account in this static preview.</p><div class="actions"><button class="btn" id="retry">Retry with a new random order</button><a class="btn secondary" href="index.html">Back to test centre</a></div>';app.querySelector('#retry').onclick=()=>location.reload();}
 render();
}).catch(()=>{app.innerHTML='<div class="empty">Unable to load the question bank. Please try again later.</div>'});
</script></body></html>
