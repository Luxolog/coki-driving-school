<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coki K53 Beta Test</title>
<style>
:root{--green:#087d45;--red:#ed1c24;--ink:#20352a;--muted:#6b7c72;--paper:#f3f7f4;--line:#d8e6dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(180deg,#fff,#dff2e6);border-bottom:4px solid var(--red);padding:18px clamp(18px,5vw,64px)}.brand{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand strong{color:var(--green);letter-spacing:.08em}.brand small{display:block;color:#60766a;font-weight:700}.brand a{color:var(--green);font-weight:800;text-decoration:none}main{max-width:1050px;margin:28px auto;padding:0 18px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:0 8px 28px #12351c0b}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.1em;color:var(--green);text-transform:uppercase}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:4px 0 8px}.beta{display:inline-block;background:#fff2d7;color:#825600;border-radius:99px;padding:4px 9px;font-size:.72rem;margin-left:8px}.progress{height:9px;background:#e5eee7;border-radius:99px;overflow:hidden;margin:16px 0 26px}.progress span{height:100%;display:block;background:var(--green)}.question{font-size:1.2rem;font-weight:800;margin:0 0 18px}.statements{margin:0 0 14px;padding:14px 18px;background:#f6faf7;border-radius:12px}.statements li{margin:5px 0}.instruction{font-size:.8rem;font-weight:900;color:var(--green);margin:0 0 12px}.visual{border:1px solid var(--line);border-radius:13px;background:#fbfdfb;padding:10px;margin:0 0 18px;display:flex;justify-content:center}.visual[hidden]{display:none!important}.visual img{max-width:100%;max-height:320px;object-fit:contain}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.option{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:14px;text-align:left;font:inherit;display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:64px}.option.selected{border:2px solid var(--green);background:#eaf6ee}.option img{display:block;max-width:100%;max-height:125px;object-fit:contain;margin-top:8px}.option-body{min-width:0}.letter{width:30px;height:30px;flex:none;border-radius:50%;background:#edf4ef;display:grid;place-items:center;font-weight:900}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}button.action{border:0;border-radius:9px;background:var(--green);color:#fff;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#eaf2ec!important;color:var(--green)!important}button:disabled{opacity:.45;cursor:not-allowed}.meta{color:var(--muted);font-size:.86rem}.notice{padding:12px;border-radius:10px;background:#f4f8f5;color:#607268;margin:14px 0}@media(max-width:650px){.options{grid-template-columns:1fr}.question{font-size:1.08rem}}
</style></head><body><header><div class="brand"><div><strong>COKI'S DRIVING SCHOOL</strong><small>K53 LEARNER PRACTICE</small></div><a href="../index.html">TEST CENTRE</a></div></header><main><section class="panel" id="app"><div class="notice">Loading beta questions…</div></section></main>
<script>
(async()=>{const app=document.getElementById('app');let bank,key;try{const [a,b]=await Promise.all([fetch('./questions.json',{cache:'no-store'}),fetch('./answer-key.json',{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error();bank=await a.json();key=await b.json()}catch(e){app.innerHTML='<div class="notice">Unable to load the beta test. Refresh the page.</div>';return}const qs=bank.questions,chosen={},imageCache={};let i=0;
async function loadB64(path){if(!imageCache[path])imageCache[path]=fetch(path).then(r=>{if(!r.ok)throw Error();return r.text()}).then(s=>'data:image/png;base64,'+s.trim());return imageCache[path]}
function render(){const q=qs[i];app.innerHTML='<div class="eyebrow">Coki K53 Beta Test <span class="beta">BETA</span></div><h1>Question '+q.number+'</h1><div class="progress"><span style="width:'+((i+1)/qs.length*100)+'%"></span></div><p class="question"></p><div class="statements" hidden></div><p class="instruction" hidden></p><div class="visual" hidden></div><div class="meta">Select one answer</div><div class="options"></div><div class="controls"><button class="action secondary" id="prev" '+(!i?'disabled':'')+'>Previous</button><span class="meta">Question '+(i+1)+' of '+qs.length+'</span><button class="action" id="next">'+(i===qs.length-1?'Finish beta test':'Next question')+'</button></div><p class="meta">Beta assessment • Correct answers are not revealed while you are answering</p>';app.querySelector('.question').textContent=q.text;
if(q.statements&&q.statements.length){const s=app.querySelector('.statements');s.hidden=false;const ol=document.createElement('ol');q.statements.forEach(t=>{const li=document.createElement('li');li.textContent=t;ol.append(li)});s.append(ol)}if(q.instruction){const p=app.querySelector('.instruction');p.hidden=false;p.textContent=q.instruction}if(q.image){const v=app.querySelector('.visual'),img=document.createElement('img');v.hidden=false;img.src=q.image;img.alt='Original question illustration';img.onerror=()=>v.hidden=true;v.append(img)}
const box=app.querySelector('.options');['A','B','C'].forEach(k=>{const btn=document.createElement('button');btn.className='option'+(chosen[q.number]===k?' selected':'');btn.type='button';const letter=document.createElement('span');letter.className='letter';letter.textContent=k;const body=document.createElement('span');body.className='option-body';const label=document.createElement('span');label.textContent=q.options[k]||('Sign '+k);body.append(label);if(q.optionImages&&q.optionImages[k]){const img=document.createElement('img');img.alt='Original sign option '+k;body.append(img);loadB64(q.optionImages[k]).then(src=>img.src=src).catch(()=>img.alt='Original sign image unavailable')}btn.append(letter,body);btn.onclick=()=>{chosen[q.number]=k;render()};box.append(btn)});app.querySelector('#prev').onclick=()=>{if(i){i--;render()}};app.querySelector('#next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()}}
function finish(){const missing=qs.findIndex(q=>!chosen[q.number]);if(missing>=0){i=missing;render();const n=document.createElement('div');n.className='notice';n.textContent='Please answer every question before finishing.';app.prepend(n);return}let score=0;qs.forEach(q=>{if(chosen[q.number]===key.answers[String(q.number)])score++});app.innerHTML='<div class="eyebrow">Beta test completed</div><h1>Your result</h1><p class="question">'+score+' / '+qs.length+' correct</p><p class="notice">Thank you for testing the Coki K53 Beta Test. Please report unclear wording or missing illustrations before this test is promoted.</p><button class="action" id="restart">Retake beta test</button> <a class="action secondary" style="text-decoration:none" href="../index.html">Back to test centre</a>';app.querySelector('#restart').onclick=()=>{i=0;Object.keys(chosen).forEach(k=>delete chosen[k]);render()}}render()})();
</script></body></html>
