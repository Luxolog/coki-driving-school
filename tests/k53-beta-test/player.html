<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coki K53 Beta Assessments</title>
<style>
:root{--g:#087d45;--red:#ed1c24;--ink:#20352a;--muted:#6b7c72;--paper:#f3f7f4;--line:#d8e6dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(180deg,#fff,#dff2e6);border-bottom:4px solid var(--red);padding:18px clamp(18px,5vw,64px)}.brand{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand strong{color:var(--g);letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-weight:700}.brand a{color:var(--g);font-weight:800;text-decoration:none}main{max-width:1050px;margin:28px auto;padding:0 18px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:0 8px 28px #12351c0b}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.1em;color:var(--g);text-transform:uppercase}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:4px 0 8px}.muted,.meta{color:var(--muted)}.meta{font-size:.86rem}.beta{display:inline-block;background:#fff2d7;color:#825600;border-radius:99px;padding:4px 9px;font-size:.72rem;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}.choice{border:1px solid var(--line);border-radius:15px;padding:20px;background:#fbfdfb}.choice h2{margin:8px 0}.btn,button.action{border:0;border-radius:9px;background:var(--g);color:#fff;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#eaf2ec!important;color:var(--g)!important}.field{display:grid;gap:6px;margin:18px 0}.field input{width:100%;max-width:430px;border:1px solid #b9c9bd;border-radius:10px;padding:12px;font:inherit}.progress{height:9px;background:#e5eee7;border-radius:99px;overflow:hidden;margin:16px 0 24px}.progress span{height:100%;display:block;background:var(--g)}.question{font-size:1.2rem;font-weight:800;margin:0 0 18px}.statements{margin:0 0 14px;padding:14px 18px;background:#f6faf7;border-radius:12px}.instruction{font-size:.8rem;font-weight:900;color:var(--g);margin:0 0 12px}.visual{border:1px solid var(--line);border-radius:13px;background:#fbfdfb;padding:10px;margin:0 0 18px;display:flex;justify-content:center}.visual[hidden]{display:none!important}.visual img{max-width:100%;max-height:340px;object-fit:contain}.options{display:grid;grid-template-columns:1fr;gap:10px}.option{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:13px;text-align:left;font:inherit;display:flex;align-items:flex-start;gap:10px;cursor:pointer;width:100%}.option img{display:block;max-width:min(100%,240px);max-height:160px;object-fit:contain;margin-top:8px}.option.selected{border:2px solid var(--g);background:#eaf6ee}.option.correct{border:2px solid #16834a;background:#e8f6ed}.option.wrong{border:2px solid #c52b32;background:#fff0f0}.letter{width:30px;height:30px;flex:none;border-radius:50%;background:#edf4ef;display:grid;place-items:center;font-weight:900}.feedback{padding:12px;border-radius:10px;margin-top:14px}.feedback.good{background:#e8f6ed;color:#126b3a}.feedback.bad{background:#fff0f0;color:#92202a}.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}.notice{padding:12px;border-radius:10px;background:#f4f8f5;color:#607268;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.tile{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fbfdfb}.tile strong{display:block;font-size:1.5rem}.pass{color:#087d45}.fail{color:#c52b32}@media(max-width:650px){.question{font-size:1.08rem}.panel{padding:18px}}
</style></head><body><header><div class="brand"><div><strong>COKI'S DRIVING SCHOOL</strong><small>K53 LEARNER PRACTICE · SOURCE-BASED BETA</small></div><a href="../index.html">TEST CENTRE</a></div></header><main><section class="panel" id="app"><div class="notice">Loading Coki K53 beta assessments…</div></section></main>
<script>
(async()=>{
const app=document.getElementById('app'),CATEGORY={"1":"road_rules","2":"road_rules","3":"vehicle_controls","4":"road_rules","5":"road_signs","6":"road_rules","7":"road_signs","8":"road_signs","9":"road_rules","10":"road_rules","11":"road_rules","12":"road_rules","13":"road_signs","14":"road_rules","15":"road_signs","16":"road_signs","17":"road_rules","18":"road_rules","19":"road_rules","20":"vehicle_controls","21":"road_signs","22":"road_signs","23":"road_signs","24":"road_signs","25":"vehicle_controls","26":"road_rules","27":"vehicle_controls","28":"road_rules","29":"road_signs","30":"road_rules","31":"road_signs","32":"road_signs","33":"road_rules","34":"vehicle_controls","35":"road_rules","36":"road_rules","37":"road_signs","38":"road_signs","39":"road_signs","40":"road_signs","41":"road_rules","42":"road_rules","43":"road_rules","44":"road_rules","45":"road_signs","46":"road_signs","47":"road_signs","48":"road_signs","49":"vehicle_controls","50":"road_rules","51":"road_rules","52":"road_rules","53":"road_signs","54":"road_signs","55":"road_signs","56":"road_signs","57":"road_rules","58":"vehicle_controls","59":"road_rules","60":"vehicle_controls","61":"road_signs","62":"road_signs","63":"road_rules","64":"road_signs","65":"road_rules","66":"road_rules","67":"road_rules","68":"vehicle_controls","69":"road_signs","70":"road_signs","71":"road_signs","72":"road_signs","73":"vehicle_controls","74":"vehicle_controls","75":"road_rules","76":"road_rules","77":"road_signs","78":"road_signs","79":"road_signs","80":"road_signs","81":"road_rules","82":"road_rules","83":"road_rules","84":"road_rules","85":"road_rules","86":"road_signs","87":"road_signs","88":"road_signs","89":"road_rules","90":"road_rules","91":"road_rules","92":"vehicle_controls","93":"road_rules","94":"road_signs","95":"road_signs","96":"road_signs","97":"road_rules","98":"road_rules","99":"road_rules","100":"vehicle_controls","101":"road_signs","102":"road_signs","103":"road_signs","104":"road_signs","105":"road_rules","106":"road_rules","107":"road_rules","108":"road_rules","109":"road_signs","110":"road_rules","111":"road_signs","112":"road_rules","113":"road_rules","114":"vehicle_controls","115":"road_rules","116":"vehicle_controls","117":"road_signs","118":"road_rules","119":"road_signs","120":"road_signs","121":"road_rules","122":"road_rules","123":"vehicle_controls","124":"road_signs","125":"road_signs","126":"road_signs","127":"road_signs","128":"road_signs"},THRESHOLDS={road_rules:22,road_signs:23,vehicle_controls:6};
let bank,key;const selected={},order=[];
try{const [a,b]=await Promise.all([fetch('./questions.json',{cache:'no-store'}),fetch('./answer-key.json',{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error();bank=await a.json();key=await b.json()}catch(e){app.innerHTML='<div class="notice">Unable to load the beta test. Refresh and try again.</div>';return}
const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
function landing(){app.innerHTML='<div class="eyebrow">Coki K53 learner assessment <span class="beta">BETA</span></div><h1>Choose your test</h1><p class="muted">The 128-question source assessment is divided into two independent 64-question tests. Each attempt uses a fresh question order and shuffled answer choices.</p><div class="grid"><article class="choice"><div class="eyebrow">Assessment 01</div><h2>Beta Test 1</h2><p>Questions 1–64 · Immediate answer feedback. The correct answer is shown after each selection.</p><button class="action" id="start1">Start Test 1</button></article><article class="choice"><div class="eyebrow">Assessment 02</div><h2>Beta Test 2</h2><p>Questions 65–128 · Immediate correct/incorrect feedback, final score and category performance.</p><button class="action" id="start2">Start Test 2</button></article></div><p class="meta" style="margin-top:20px">Both tests use the same assessment logic: immediate correct/incorrect feedback, a final score and a category performance breakdown. Each contains 64 questions.</p>';app.querySelector('#start1').onclick=()=>begin(1);app.querySelector('#start2').onclick=()=>begin(2)}
function begin(which){const mode=which===1?'test1':'test2',start=which===1?1:65,end=which===1?64:128,source=bank.questions.filter(q=>q.number>=start&&q.number<=end);if(source.length!==64){app.innerHTML='<div class="notice">This assessment requires 64 questions; '+source.length+' were loaded.</div>';return}const prior=JSON.parse(localStorage.getItem('coki_beta_order_'+mode)||'[]');let ordered=shuffle(source);if(prior.length===ordered.length&&ordered.every((q,i)=>String(q.number)===String(prior[i])))ordered=ordered.slice(1).concat(ordered[0]);localStorage.setItem('coki_beta_order_'+mode,JSON.stringify(ordered.map(q=>q.number)));order.splice(0,order.length,...ordered.map(q=>({...q,shuffled:shuffle(['A','B','C'].map(letter=>({letter,text:q.options[letter],correct:key.answers[String(q.number)]===letter})))})));Object.keys(selected).forEach(k=>delete selected[k]);let idx=0;const student=prompt('Enter your Coki student ID to identify this attempt:');if(!student||!student.trim()){landing();return}const startedAt=new Date().toISOString();
function render(){const q=order[idx],answer=selected[q.number],answered=!!answer,correct=q.shuffled.find(o=>o.correct);app.innerHTML='<div class="eyebrow">Coki K53 Beta · '+(which===1?'Test 1':'Test 2')+'</div><h1>Question '+q.number+' <span class="meta">of 128</span></h1><div class="progress"><span style="width:'+((idx+1)/64*100)+'%"></span></div><p class="question"></p><div class="statements" hidden></div><p class="instruction" hidden></p><div class="visual" hidden></div><div class="meta">Select one answer · '+Object.keys(selected).length+' of 64 answered</div><div class="options"></div><div id="feedback"></div><div class="controls"><button class="action secondary" id="prev" '+(!idx?'disabled':'')+'>Previous</button><button class="action" id="next" '+(!answered?'disabled':'')+'>'+(idx===63?'Submit test':'Next question')+'</button></div>';app.querySelector('.question').textContent=q.text;if(q.statements?.length){const box=app.querySelector('.statements');box.hidden=false;const ol=document.createElement('ol');ol.type='i';q.statements.forEach(t=>{const li=document.createElement('li');li.textContent=t;ol.append(li)});box.append(ol)}if(q.instruction){const el=app.querySelector('.instruction');el.hidden=false;el.textContent=q.instruction}if(q.image){const v=app.querySelector('.visual'),img=document.createElement('img');v.hidden=false;img.src=q.image+'?v=20261125-heidelberg-fix';img.alt='Original question image for question '+q.number;img.onerror=()=>v.hidden=true;v.append(img)}const box=app.querySelector('.options');q.shuffled.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='option'+(answer===o.letter?' selected':'');if(answered){if(o.correct)b.classList.add('correct');if(answer===o.letter&&!o.correct)b.classList.add('wrong')}const l=document.createElement('span');l.className='letter';l.textContent=o.letter;const body=document.createElement('span');body.textContent=o.text||'';b.append(l,body);if(q.optionImages?.[o.letter]){const oi=document.createElement('img');oi.alt='Option '+o.letter+' image';oi.loading='lazy';body.append(oi);fetch(q.optionImages[o.letter],{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('image');return r.text()}).then(s=>{oi.src='data:image/png;base64,'+s.trim()}).catch(()=>{oi.remove()})}b.disabled=answered;b.onclick=()=>{selected[q.number]=o.letter;render()};box.append(b)});if(answered){const good=answer===correct.letter,fb=document.createElement('div');fb.className='feedback '+(good?'good':'bad');fb.textContent=good?'Correct answer. Well done.':'Incorrect. The correct answer is '+correct.letter+': '+correct.text;app.querySelector('#feedback').append(fb)}app.querySelector('#prev').onclick=()=>{if(idx>0){idx--;render()}};app.querySelector('#next').onclick=()=>{if(idx<63){idx++;render()}else finish()}}
function finish(){const missing=order.findIndex(q=>!selected[q.number]);if(missing>=0){idx=missing;render();const n=document.createElement('div');n.className='notice';n.textContent='Please answer every question before submitting.';app.prepend(n);return}const stats={road_rules:{correct:0,total:0},road_signs:{correct:0,total:0},vehicle_controls:{correct:0,total:0}};let score=0;order.forEach(q=>{const cat=CATEGORY[q.number]||'road_rules';stats[cat].total++;if(selected[q.number]===key.answers[String(q.number)]){score++;stats[cat].correct++}});const passed=Object.entries(stats).every(([cat,s])=>s.correct>=THRESHOLDS[cat]);const pct=Math.round(score/64*100);const record={studentId:student.trim(),test:mode,completedAt:new Date().toISOString(),score,total:64,percentage:pct,passed,categoryStats:stats,answers:order.map(q=>({questionNumber:q.number,selected:selected[q.number],correct:key.answers[String(q.number)],isCorrect:selected[q.number]===key.answers[String(q.number)]}))};const records=JSON.parse(localStorage.getItem('coki_beta_attempts')||'[]');records.push(record);localStorage.setItem('coki_beta_attempts',JSON.stringify(records));app.innerHTML='<div class="eyebrow">Assessment completed</div><h1>'+(which===1?'Beta Test 1':'Beta Test 2')+' result</h1><div class="stats"><div class="tile"><span class="meta">Score</span><strong>'+score+'/64</strong></div><div class="tile"><span class="meta">Percentage</span><strong>'+pct+'%</strong></div><div class="tile"><span class="meta">Result</span><strong class="'+(which===1?'':passed?'pass':'fail')+'">'+(passed?'PASS':'NOT YET PASSED')+'</strong></div></div><h2>Category performance</h2><div class="stats">'+Object.entries(stats).map(([cat,s])=>'<div class="tile"><span class="meta">'+cat.replace('_',' ')+'</span><strong>'+s.correct+'/'+s.total+'</strong><span class="meta">'+(which===2?'Minimum required: '+THRESHOLDS[cat]:'Practice result')+'</span></div>').join('')+'</div><p class="notice">'+(passed?'You met the minimum score in all three categories.':'You did not meet the minimum in every category. Review the category results before your next attempt.')+'</p><div class="controls"><button class="action" id="retry">Retake this test</button><button class="action secondary" id="home">Back to test selection</button></div>';app.querySelector('#retry').onclick=()=>begin(which);app.querySelector('#home').onclick=landing}
render()}
const requested=new URLSearchParams(location.search).get("test");if(requested==="1")begin(1);else if(requested==="2")begin(2);else landing();
})();
</script></body></html>
